# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ankita-demo-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build api project
        working-directory: ./api
        run: dotnet build --configuration Release

      - name: dotnet publish api
        working-directory: ./api
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./.net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34DFA67BC47541058D58E3ADE37A4F7B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_744C34887A2D4262AB5587BCE97A55E9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_616B657578FA403BB0BDF86905FD069A }}

      - name: Set connection string app setting (hardcoded)
        run: |
          APP_NAME='ankita-demo-api-azd9cndpebgsdpbz'
          RG='Ankita-demo-rg'
          echo "Setting ConnectionStrings__DefaultConnection on $APP_NAME in resource group $RG"
          set +e
          az webapp config appsettings set --name "$APP_NAME" --resource-group "$RG" --settings 'ConnectionStrings__DefaultConnection=Server=tcp:ankita-server.database.windows.net,1433;Initial Catalog=ankita-demo-db;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Default;'
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "Warning: failed to set app setting. The service principal may lack permissions. Deployment will continue but you may need to configure the app setting manually in Azure Portal.";
            echo "SKIP_CONFIG=true" >> $GITHUB_ENV
          else
            echo "SKIP_CONFIG=false" >> $GITHUB_ENV
          fi

      - name: Enable system-assigned managed identity on Web App (hardcoded)
        run: |
          APP_NAME='ankita-demo-api-azd9cndpebgsdpbz'
          RG='Ankita-demo-rg'
          echo "Enabling system-assigned managed identity for $APP_NAME"
          set +e
          az webapp identity assign --name "$APP_NAME" --resource-group "$RG"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "Warning: failed to assign system-managed identity. You may not have permissions."
          else
            echo "Managed identity assigned. Fetching identity details..."
            az webapp identity show --name "$APP_NAME" --resource-group "$RG" --query "principalId" -o tsv | awk '{print "PRINCIPAL_ID="$0}' > principal.env || true
            az webapp identity show --name "$APP_NAME" --resource-group "$RG" --query "principalId" -o tsv || true
            echo "Stored principalId in principal.env (not a secret)."
          fi

      - name: Attach user-assigned managed identity and set AZURE_CLIENT_ID
        run: |
          APP_NAME='ankita-demo-api-azd9cndpebgsdpbz'
          RG='Ankita-demo-rg'
          UA_NAME='oidc-msi-834c'
          UA_CLIENT_ID='5d515563-ef72-4da7-9a46-dfeedbefa182'
          echo "Looking up user-assigned identity resource id for $UA_NAME in $RG"
          set +e
          ID=$(az identity show -g "$RG" -n "$UA_NAME" --query id -o tsv)
          if [ -z "$ID" ]; then echo "User-assigned identity $UA_NAME not found in resource group $RG"; echo "SKIP_CONFIG=true" >> $GITHUB_ENV; exit 0; fi
          echo "Attaching user-assigned identity $ID to web app $APP_NAME"
          az webapp identity assign --identities "$ID" --name "$APP_NAME" --resource-group "$RG"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "Warning: failed to attach user-assigned identity. You may not have sufficient permissions.";
            echo "SKIP_CONFIG=true" >> $GITHUB_ENV
          else
            echo "Setting AZURE_CLIENT_ID app setting so DefaultAzureCredential uses the user-assigned identity"
            az webapp config appsettings set --name "$APP_NAME" --resource-group "$RG" --settings "AZURE_CLIENT_ID=$UA_CLIENT_ID"
          fi
          set -e
          echo "User-assigned identity step completed."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          # use the actual App Service name (resource name) you've created
          app-name: 'ankita-demo-api-azd9cndpebgsdpbz'
          slot-name: 'Production'
          package: ${{ github.workspace }}/.net-app

      - name: Post-deploy health check
        if: env.SKIP_CONFIG != 'true'
        run: |
          URL="https://ankita-demo-api-azd9cndpebgsdpbz.westus3-01.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed (status 200)"; exit 0
            fi
            echo "Attempt $i: status=$status; waiting..."
            sleep 10
          done
          echo "Health check failed after retries"; exit 1
          