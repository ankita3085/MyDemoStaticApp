# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ankita-demo-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build api project
        working-directory: ./api
        run: dotnet build --configuration Release

      - name: dotnet publish api
        working-directory: ./api
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./.net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34DFA67BC47541058D58E3ADE37A4F7B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_744C34887A2D4262AB5587BCE97A55E9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_616B657578FA403BB0BDF86905FD069A }}

      - name: Set connection string app setting
        env:
          APP_NAME: 'ankita-demo-api-azd9cndpebgsdpbz'
        run: |
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ] || [ -z "${{ secrets.DB_CONN_STRING }}" ]; then
            echo "Missing AZURE_RESOURCE_GROUP or DB_CONN_STRING secret. Please add both to repository secrets.";
            exit 1;
          fi
          az webapp config appsettings set --name "$APP_NAME" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --settings "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONN_STRING }}"

      - name: Enable system-assigned managed identity on Web App
        env:
          APP_NAME: 'ankita-demo-api-azd9cndpebgsdpbz'
        run: |
          echo "Enabling system-assigned managed identity for $APP_NAME"
          az webapp identity assign --name "$APP_NAME" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "Managed identity assigned. Fetching identity details..."
          az webapp identity show --name "$APP_NAME" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "principalId" -o tsv | awk '{print "PRINCIPAL_ID="$0}' > principal.env
          az webapp identity show --name "$APP_NAME" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "principalId" -o tsv
          echo "Stored principalId in principal.env (not a secret)."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          # use the actual App Service name (resource name) you've created
          app-name: 'ankita-demo-api-azd9cndpebgsdpbz'
          slot-name: 'Production'
          package: ${{ github.workspace }}/.net-app

      - name: Post-deploy health check
        run: |
          URL="https://ankita-demo-api-azd9cndpebgsdpbz.westus3-01.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed (status 200)"; exit 0
            fi
            echo "Attempt $i: status=$status; waiting..."
            sleep 10
          done
          echo "Health check failed after retries"; exit 1
          