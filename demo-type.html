<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo: Type</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Demo: Typewriter</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="demo-type.html">Demo: Type</a>
    </nav>
  </header>
  <main>
    <section>
      <p id="type-target" class="type"></p>
      <button id="start">Start</button>
      <button id="restart">Restart</button>
    </section>
    <section>
      <h3>About</h3>
      <p>This page shows a tiny JavaScript typewriter effect. It doesn't require any build tools—just open the file in a browser.</p>
    </section>
  </main>
  <footer>
    <p>Generated by GitHub Copilot</p>
  </footer>

  <script>
    (function() {
      const text = "This is a simple typewriter demo. Replace this text to try other content.";
      const target = document.getElementById('type-target');
      const startBtn = document.getElementById('start');
      const restartBtn = document.getElementById('restart');
      let idx = 0;
      let timer = null;

      function type() {
        if (idx <= text.length) {
          target.textContent = text.slice(0, idx);
          idx++;
          timer = setTimeout(type, 60);
        } else {
          clearTimeout(timer);
        }
      }

      startBtn.addEventListener('click', function() {
        if (timer) return;
        type();
      });

      restartBtn.addEventListener('click', function() {
        clearTimeout(timer);
        idx = 0;
        target.textContent = '';
        type();
      });

      // Start on load
      window.addEventListener('load', function() {
        idx = 0;
        target.textContent = '';
      });
    })();
  </script>
</body>
</html>
